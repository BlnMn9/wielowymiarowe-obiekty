<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wielowymiarowe Obiekty Geometryczne</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        p {
            margin: 0 0 20px 0;
            color: #aaa;
            font-size: 14px;
            max-width: 400px;
            line-height: 1.4;
        }

        .btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1 id="object-title">1. Teserakt (Hiperkostka 4D)</h1>
        <p id="object-desc">Oglądasz rzut perspektywiczny czterowymiarowej kostki rotującej jednocześnie w kilku płaszczyznach przestrzeni 4D. Posiada 16 wierzchołków i 32 krawędzie.</p>
        <button class="btn" id="next-btn">Następny obiekt</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- SEKCJA INICJALIZACJI THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 4;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00ffcc, 1, 100);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // Kontenery na grafikę Three.js
        let vertexGroup = new THREE.Group();
        let edgeGroup = new THREE.Group();
        scene.add(vertexGroup);
        scene.add(edgeGroup);

        // Kąty obrotu 3D widoku
        vertexGroup.rotation.x = 0.5; vertexGroup.rotation.y = 0.5;
        edgeGroup.rotation.x = 0.5; edgeGroup.rotation.y = 0.5;

        // --- GLOBALNE ZMIENNE GEOMETRII 4D ---
        let vertices4D = [];
        let edges = [];
        let spheres = [];
        let lineGeometries = [];
        
        let angleXW = 0;
        let angleYW = 0;
        let angleZW = 0;
        let currentObject = 1; // 1 = Teserakt, 2 = Pentachor

        // --- MATERIAŁY ---
        const sphereGeo = new THREE.SphereGeometry(0.05, 16, 16);
        const sphereMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x00ffcc });
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.8 });

        // --- GENEROWANIE TESERAKTU ---
        function loadTesseract() {
            clearGeometry();
            
            // 16 wierzchołków
            for (let x of [-1, 1]) {
                for (let y of [-1, 1]) {
                    for (let z of [-1, 1]) {
                        for (let w of [-1, 1]) {
                            vertices4D.push({x: x * 0.9, y: y * 0.9, z: z * 0.9, w: w * 0.9});
                        }
                    }
                }
            }

            // 32 krawędzie (łączymy punkty różniące się o 1 współrzędną)
            for (let i = 0; i < vertices4D.length; i++) {
                for (let j = i + 1; j < vertices4D.length; j++) {
                    let diff = 0;
                    if (vertices4D[i].x !== vertices4D[j].x) diff++;
                    if (vertices4D[i].y !== vertices4D[j].y) diff++;
                    if (vertices4D[i].z !== vertices4D[j].z) diff++;
                    if (vertices4D[i].w !== vertices4D[j].w) diff++;
                    if (diff === 1) edges.push([i, j]);
                }
            }

            buildThreeObjects();
        }

        // --- GENEROWANIE PENTACHORA (5-KOMÓRKA) ---
        function loadPentachor() {
            clearGeometry();

            // Matematyczne wierzchołki regularnego sympleksu 4D (pentachora)
            // Używamy znormalizowanych współrzędnych dla ładnego balansu w przestrzeni
            const s = 1 / Math.sqrt(10);
            vertices4D = [
                { x: 0,                 y: 0,                 z: 0,                 w: 4 * s },
                { x: 0,                 y: 0,                 z: Math.sqrt(3/2),    w: -s },
                { x: 0,                 y: Math.sqrt(2),      z: -1/Math.sqrt(6),   w: -s },
                { x: Math.sqrt(5/4),    y: -1/Math.sqrt(2),   z: -1/Math.sqrt(6),   w: -s },
                { x: -Math.sqrt(5/4),   y: -1/Math.sqrt(2),   z: -1/Math.sqrt(6),   w: -s }
            ];

            // W pentachorze każdy wierzchołek łączy się z każdym (5 wierzchołków -> 10 krawędzi)
            for (let i = 0; i < vertices4D.length; i++) {
                for (let j = i + 1; j < vertices4D.length; j++) {
                    edges.push([i, j]);
                }
            }

            buildThreeObjects();
        }

        // --- FUNKCJE POMOCNICZE TWORZENIA SCENY ---
        function clearGeometry() {
            while(vertexGroup.children.length > 0){ vertexGroup.remove(vertexGroup.children[0]); }
            while(edgeGroup.children.length > 0){ edgeGroup.remove(edgeGroup.children[0]); }
            vertices4D = [];
            edges = [];
            spheres = [];
            lineGeometries = [];
        }

        function buildThreeObjects() {
            // Tworzenie sfer (wierzchołków)
            vertices4D.forEach(() => {
                const mesh = new THREE.Mesh(sphereGeo, sphereMat);
                vertexGroup.add(mesh);
                spheres.push(mesh);
            });

            // Tworzenie linii (krawędzi)
            edges.forEach(() => {
                const geo = new THREE.BufferGeometry();
                const positions = new Float32Array(6); 
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const line = new THREE.Line(geo, lineMat);
                edgeGroup.add(line);
                lineGeometries.push(geo);
            });
        }

        // --- PROJEKCJA PERSPEKTYWICZNA 4D -> 3D ---
        function project4D() {
            const projectedVertices = [];

            vertices4D.forEach(v => {
                let x = v.x; let y = v.y; let z = v.z; let w = v.w;

                // Rotacja w płaszczyźnie XW
                let cosXW = Math.cos(angleXW); let sinXW = Math.sin(angleXW);
                let x1 = x * cosXW - w * sinXW; let w1 = x * sinXW + w * cosXW;
                x = x1; w = w1;

                // Rotacja w płaszczyźnie YW
                let cosYW = Math.cos(angleYW); let sinYW = Math.sin(angleYW);
                let y1 = y * cosYW - w * sinYW; let w2 = y * sinYW + w * cosYW;
                y = y1; w = w2;

                // Projekcja perspektywiczna z 4D do 3D
                const distance4D = currentObject === 1 ? 2 : 1.5; 
                const factor = 1 / (distance4D - w);

                const scale = currentObject === 1 ? 1.5 : 1.2;
                const x3D = x * factor * scale;
                const y3D = y * factor * scale;
                const z3D = z * factor * scale;

                projectedVertices.push(new THREE.Vector3(x3D, y3D, z3D));
            });

            // Aktualizacja pozycji obiektów Three.js
            for(let i = 0; i < spheres.length; i++) {
                if(projectedVertices[i]) spheres[i].position.copy(projectedVertices[i]);
            }

            edges.forEach((edge, index) => {
                const geo = lineGeometries[index];
                if(geo && projectedVertices[edge[0]] && projectedVertices[edge[1]]) {
                    const posAttr = geo.attributes.position;
                    posAttr.setXYZ(0, projectedVertices[edge[0]].x, projectedVertices[edge[0]].y, projectedVertices[edge[0]].z);
                    posAttr.setXYZ(1, projectedVertices[edge[1]].x, projectedVertices[edge[1]].y, projectedVertices[edge[1]].z);
                    posAttr.needsUpdate = true;
                }
            });
        }

        // --- PĘTLA ANIMACJI ---
        function animate() {
            requestAnimationFrame(animate);

            // Prędkość obrotów dopasowana do obiektu
            const speedMod = currentObject === 1 ? 1 : 0.6;
            angleXW += 0.01 * speedMod;
            angleYW += 0.007 * speedMod;

            project4D();

            vertexGroup.rotation.y += 0.003;
            edgeGroup.rotation.y += 0.003;

            renderer.render(scene, camera);
        }

        // Ładowanie początkowe
        loadTesseract();
        animate();

        // --- OBSŁUGA INTERFEJSU I ZMIANY ROZMIARU ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const titleEl = document.getElementById('object-title');
        const descEl = document.getElementById('object-desc');
        const nextBtn = document.getElementById('next-btn');

        nextBtn.addEventListener('click', () => {
            if (currentObject === 1) {
                currentObject = 2;
                titleEl.innerText = "2. Pentachor (5-Komórka)";
                descEl.innerText = "Czterowymiarowy odpowiednik czworościanu (simplex 4D). Składa się z 5 wierzchołków i 10 krawędzi. Każdy wierzchołek jest bezpośrednio połączony z każdym innym.";
                nextBtn.innerText = "Zobacz Teserakt";
                loadPentachor();
            } else {
                currentObject = 1;
                titleEl.innerText = "1. Teserakt (Hiperkostka 4D)";
                descEl.innerText = "Oglądasz rzut perspektywiczny czterowymiarowej kostki rotującej jednocześnie w kilku płaszczyznach przestrzeni 4D. Posiada 16 wierzchołków i 32 krawędzie.";
                nextBtn.innerText = "Zobacz Pentachor";
                loadTesseract();
            }
        });
    </script>
</body>
</html>
