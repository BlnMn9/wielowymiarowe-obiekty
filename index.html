<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wielowymiarowe Obiekty Geometryczne</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        p {
            margin: 0 0 20px 0;
            color: #aaa;
            font-size: 14px;
            max-width: 400px;
            line-height: 1.4;
        }

        .btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1 id="object-title">1. Teserakt (Hiperkostka 4D)</h1>
        <p id="object-desc">Oglądasz rzut perspektywiczny czterowymiarowej kostki rotującej jednocześnie w kilku płaszczyznach przestrzeni 4D. Posiada 16 wierzchołków i 32 krawędzie.</p>
        <button class="btn" id="next-btn">Następny obiekt</button>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="hypergeometry.js"></script>

    <script>
        // Tablica z opisami obiektów dla UI (Zaktualizowana do 12 unikalnych obiektów)
        const objectsUI = {
            1: { title: "1. Teserakt (Hiperkostka 4D)", desc: "Oglądasz rzut perspektywiczny czterowymiarowej kostki rotującej jednocześnie w kilku płaszczyznach przestrzeni 4D. Posiada 16 wierzchołków i 32 krawędzie." },
            2: { title: "2. Pentachor (5-Komórka)", desc: "Matematycznie wycentrowana 4-wymiarowa odmiana czworościanu. Posiada 5 wierzchołków połączonych w idealną, harmonijną sieć 10 krawędzi, która płynnie rotuje w kadrze." },
            3: { title: "3. 24-Komórka (Ikositetrachor)", desc: "Wyjątkowa wielokomórka regularna, która istnieje WYŁĄCZNIE w 4 wymiarach! Posiada 24 wierzchołki i 96 krawędzi, tworząc niesamowitą strukturę krystaliczną." },
            4: { title: "4. 16-Komórka (Heksadekachor)", desc: "Czterowymiarowy odpowiednik ośmiościanu foremnego. Posiada tylko 8 wierzchołków i 24 krawędzie. Dzięki przestrzennej przejrzystości, bez problemu zaobserwujesz tutaj ruch każdej pojedynczej linii." },
            5: { title: "5. 5-Sympleks (Pentachoron 5D)", desc: "Najprostszy możliwy wielotop regularny w 5 wymiarach (odpowiednik trójkąta w 2D). Składa się z 6 wierzchołków, z których absolutnie każdy połączony jest z każdym innym, tworząc sieć 15 krawędzi." },
            6: { title: "6. Hekterakt (Hipersześcian 6D)", desc: "Ekstremalna geometria sześciu wymiarów! Hipersześcian 6D posiada 64 wierzchołki oraz 192 krawędzie. Wizualizacja powstaje za pomocą potrójnego rzutowania perspektywicznego." },
            7: { title: "7. Hepterakt (Hipersześcian 7D)", desc: "Imponująca struktura w przestrzeni siedmiowymiarowej. Zawiera aż 128 wierzchołków i 448 łączących je linii. Trójwymiarowy obraz powstaje na drodze poczwórnego rzutu perspektywicznego." },
            8: { title: "8. Hiperpiramida Dodekaedryczna (Stożek 4D)", desc: "Obiekt hybrydowy. Podstawą jest trójwymiarowy dwunastościan foremny (20 wierzchołków) umieszczony w przestrzeni 3D, natomiast pojedynczy wierzchołek (czubek piramidy) wysunięty jest w czwarty wymiar. Posiada 21 wierzchołków i 50 krawędzi." },
            9: { title: "9. Butelka Kleina w 4D", desc: "Słynna jednostronna powierzchnia topologiczna. W trójwymiarze musi przecinać samą siebie, jednak rzutowana z przestrzeni 4D gładko przechodzi 'nad' swoją strukturą dzięki osi W. Wizualizacja składa się ze 120 punktów ułożonych w rurę." },
            10: { title: "10. Hipercylinder (Hiperenatka 4D)", desc: "Czterowymiarowa figura walcowata (Spherinder). Powstaje z rozciągnięcia trójwymiarowej sfery wzdłuż czwartego wymiaru (osi W). Składa się ze 120 wierzchołków połączonych w podłużną strukturę klatkową o 240 krawędziach." },
            11: { title: "11. Ortopleks 5D (Cross-Polytope)", desc: "Pięciowymiarowy odpowiednik ośmiościanu foremnego. Posiada 10 wierzchołków i 40 krawędzi. Jego geometryczna struktura tworzy hipnotyzujący wzór podczas rotacji w głębokich wymiarach przestrzeni 5D." },
            12: { title: "12. Penterakt (Hipersześcian 5D)", desc: "Kostka w przestrzeni pięciowymiarowej wygenerowana wektorowo! Składa się z 32 wierzchołków i 80 krawędzi. To co widzisz, to podwójny rzut perspektywiczny (z 5D do 4D, a następnie do przestrzeni 3D) ujawniający hipnotyzujące przeplatanie linii." },
            13: { title: "13. Dwucylinder (Duocylinder 4D)", desc: "Czterowymiarowy obiekt będący iloczynem kartezjańskim dwóch kół. Posiada unikalną cechę: cała jego powierzchnia jest idealnie zakrzywiona i zamknięta w 4D. W rzucie trójwymiarowym ujawnia się jako fascynująca, spleciona klatka przypominająca podwójny torus." }
        };

        const titleEl = document.getElementById('object-title');
        const descEl = document.getElementById('object-desc');
        const nextBtn = document.getElementById('next-btn');

        nextBtn.addEventListener('click', () => {
    const nextID = switchObject(); 

    titleEl.innerText = objectsUI[nextID].title;
    descEl.innerText = objectsUI[nextID].desc;

    // Zmienione z 11 na 12, ponieważ mamy teraz 12 obiektów!
    if (nextID === 12) {
        nextBtn.innerText = "Zobacz Teserakt";
    } else {
        nextBtn.innerText = "Następny obiekt";
    }
});

    </script>
</body>
</html>
